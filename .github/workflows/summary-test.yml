name: Release summary - test (temporary)

# Temporary: sends the private release summary (with the Reddit post) to the owner's chat only, using the next
# release's notes and example links. Remove this workflow afterwards.

on:
  push:
    branches: [feature/release-summary]
    paths: [.github/workflows/summary-test.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Send a test summary to the owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GITHUB_RELEASE_URL: https://github.com/DigiNode-Tools/diginode-tools/releases/tag/v26.10.04
          TELEGRAM_OUTCOME: skipped
          BLUESKY_OUTCOME: skipped
        run: |
          awk '/^### DigiNode Tools - Unreleased/{print "DigiNode Tools v26.10.05"; print ""; on=1; next} on && /^### DigiNode Tools v/{exit} on && NF' \
            docs/release_notes.md > "$RUNNER_TEMP/notes.md"
          .github/release-summary.py send 26.10.05 "$RUNNER_TEMP/notes.md"
