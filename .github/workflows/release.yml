name: Release DigiNode Tools

# Releases whatever is on develop: gives it this month's next version number (e.g. v26.10.01), updates the version and
# date everywhere, merges develop into main, tags it, and publishes the GitHub release with its release notes. Then
# develop gets a placeholder version for the next release.
#
# A dry run does all of this without pushing, tagging or publishing anything, and shows what would happen.
#
# Weekly release: every Tuesday at 10:00 UK time, if there is anything under "Unreleased" in the release notes.
# Only merge features into develop when they are ready to release. For an emergency fix, merge it into develop and
# run this manually (untick Dry run) to release straight away.
# (Scheduled runs use this file from main, so changes to the schedule only take effect once they are on main.)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - show what would happen, without releasing anything"
        type: boolean
        default: true
  schedule:
    # Tuesdays at 09:07 and 10:07 UTC - one of these is 10:xx UK time, summer or winter (release.sh due checks)
    - cron: "7 9,10 * * 2"

permissions:
  contents: write
  issues: write   # To report a failed Telegram announcement

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The weekly release is always real; a manual one follows the Dry run box
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Is a release due?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if reason=$(.github/release.sh due); then
              echo "go=true" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
            echo "$reason"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the scripts
        if: ${{ steps.due.outputs.go == 'true' }}
        run: |
          bash -n diginode-setup.sh
          bash -n diginode.sh
          bash -n .github/release.sh
          echo "Syntax OK"

      - name: Work out the version and prepare the release
        if: ${{ steps.due.outputs.go == 'true' }}
        id: prep
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          version=$(.github/release.sh version)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          .github/release.sh prepare "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit, and merge develop into main
        if: ${{ steps.due.outputs.go == 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$VERSION"
          git checkout -q main
          git merge --no-ff -q develop -m "Release v$VERSION (merge develop into main)"
          git tag -a "v$VERSION" -m "DigiNode Tools v$VERSION"
          echo "Merged into main and tagged v$VERSION (locally)"

      - name: Summary
        if: ${{ steps.due.outputs.go == 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run: DigiNode Tools v$VERSION"
              echo "Nothing has been pushed, tagged or published. Run it again with **Dry run** unticked to release."
            else
              echo "## Releasing DigiNode Tools v$VERSION"
            fi
            echo
            echo "### What changes on develop"
            echo '```diff'
            git diff origin/develop develop -- diginode-setup.sh diginode.sh docs/release_notes.md
            echo '```'
            echo "### Commits going into main"
            echo '```'
            git log --oneline origin/main..main
            echo '```'
            echo "### GitHub release notes"
            cat "$NOTES_FILE"
            if [ -x .github/telegram-announce.sh ]; then
              echo
              echo "### Telegram announcement"
              echo '```html'
              .github/telegram-announce.sh preview "$VERSION" "$NOTES_FILE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          # Push develop and main together, so they can't end up out of step
          git push --atomic origin develop main "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "DigiNode Tools v$VERSION" --notes-file "$NOTES_FILE" --latest

      # Post the release notes in the DigiNode Tools Telegram group (as "DigiNode Tools Releases") and pin them.
      # If this fails, the release has still been published - an issue is opened instead of failing the release.
      - name: Announce on Telegram
        id: announce
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if [ -x .github/telegram-announce.sh ]; then
            .github/telegram-announce.sh send "$VERSION" "$NOTES_FILE"
          fi

      - name: Report a failed Telegram announcement
        if: ${{ steps.announce.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          gh issue create --title "Telegram announcement failed for v$VERSION" \
            --body "DigiNode Tools v$VERSION was released, but it couldn't be announced on Telegram. See the workflow run for the error: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Get develop ready for the next release
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          git checkout -q develop
          .github/release.sh bump "$VERSION"
          git commit -qam "Develop: placeholder version for the next release"
          git push origin develop
