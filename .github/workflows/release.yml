name: Release DigiNode Tools

# Releases whatever is on develop: gives it this month's next version number (e.g. v26.10.01), updates the version and
# date everywhere, merges develop into main, tags it, and publishes the GitHub release with its release notes. Then
# develop gets a placeholder version for the next release.
#
# A dry run does all of this without pushing, tagging or publishing anything, and shows what would happen.
#
# Scheduling: set "Release in days" to 1 or more to release later instead of now. The date is saved in
# .github/release-on on develop, and a daily check (about 10:00 UK time) releases it when the date arrives.
# Set it to "cancel" to cancel a scheduled release. (Scheduled runs use this file from main, so changes to the
# schedule part of this workflow only take effect once they are on main.)

on:
  workflow_dispatch:
    inputs:
      release_in_days:
        description: "When to release: 0 = now. 1 or more = that many days from today (about 10:00 UK time). cancel = cancel a scheduled release."
        type: string
        default: "0"
      dry_run:
        description: "Dry run - show what would happen, without releasing or scheduling anything"
        type: boolean
        default: true
  schedule:
    - cron: "0 9 * * *"   # Daily at 09:00 UTC (10:00 UK summer time) - releases only if one is scheduled for today

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  # Schedule (or cancel) a release for later, instead of releasing now
  schedule:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_in_days != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop

      - name: Schedule the release
        env:
          DAYS: ${{ inputs.release_in_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          result=$(.github/release.sh schedule "$DAYS")
          if [ "$DRY_RUN" = "true" ]; then
            msg="Dry run: $result. Nothing has been saved - run it again with **Dry run** unticked."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A .github/release-on
            if git diff --cached --quiet; then
              msg="$result (no change)"
            else
              git commit -qm "Schedule release: $result"
              git push origin develop
              msg="$result"
            fi
          fi
          echo "## $msg" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg"

  release:
    if: ${{ github.event_name == 'schedule' || inputs.release_in_days == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Scheduled releases are always real; a manual one follows the Dry run box
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Is a release due?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if reason=$(.github/release.sh due); then
              echo "go=true" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
            echo "$reason"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the scripts
        if: ${{ steps.due.outputs.go == 'true' }}
        run: |
          bash -n diginode-setup.sh
          bash -n diginode.sh
          bash -n .github/release.sh
          echo "Syntax OK"

      - name: Work out the version and prepare the release
        if: ${{ steps.due.outputs.go == 'true' }}
        id: prep
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          version=$(.github/release.sh version)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          .github/release.sh prepare "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit, and merge develop into main
        if: ${{ steps.due.outputs.go == 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$VERSION"
          git checkout -q main
          git merge --no-ff -q develop -m "Release v$VERSION (merge develop into main)"
          git tag -a "v$VERSION" -m "DigiNode Tools v$VERSION"
          echo "Merged into main and tagged v$VERSION (locally)"

      - name: Summary
        if: ${{ steps.due.outputs.go == 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run: DigiNode Tools v$VERSION"
              echo "Nothing has been pushed, tagged or published. Run it again with **Dry run** unticked to release."
            else
              echo "## Releasing DigiNode Tools v$VERSION"
            fi
            echo
            echo "### What changes on develop"
            echo '```diff'
            git diff origin/develop develop -- diginode-setup.sh diginode.sh docs/release_notes.md
            echo '```'
            echo "### Commits going into main"
            echo '```'
            git log --oneline origin/main..main
            echo '```'
            echo "### GitHub release notes"
            cat "$NOTES_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          # Push develop and main together, so they can't end up out of step
          git push --atomic origin develop main "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "DigiNode Tools v$VERSION" --notes-file "$NOTES_FILE" --latest

      - name: Get develop ready for the next release
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          git checkout -q develop
          .github/release.sh bump "$VERSION"
          git commit -qam "Develop: placeholder version for the next release"
          git push origin develop
