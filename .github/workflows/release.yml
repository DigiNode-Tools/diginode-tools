name: Release DigiNode Tools

# On a release Tuesday: what sponsors have had for two weeks (the preview branch) is released to everyone, and what is
# on develop becomes the new Sponsors Preview. See .github/release.sh.
#
# A dry run does all of this without pushing, tagging or publishing anything, and shows what would happen.
#
# Scheduled: every other Tuesday at 10:00 UK time (from 20 October 2026; set in .github/release.sh).
# Run by hand: releases the waiting preview straight away (a fix for it goes on develop and the preview branch), then
# starts a new one. If no preview is waiting, tick Emergency to release develop straight to everyone.
# (Scheduled runs use this file from main, so changes to the schedule only take effect once they are on main.)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - show what would happen, without releasing anything"
        type: boolean
        default: true
      emergency:
        description: "Emergency: no preview is waiting, so release develop straight to everyone"
        type: boolean
        default: false
  schedule:
    # Tuesdays at 09:07 and 10:07 UTC - one of these is 10:xx UK time, summer or winter. release.sh due checks the time,
    # and that it's a release Tuesday (every other Tuesday)
    - cron: "7 9,10 * * 2"

permissions:
  contents: write
  issues: write   # To report a failed Telegram or Bluesky announcement

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The scheduled release is always real; a manual one follows the Dry run box
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      # release.sh runs from a copy: the steps below switch branches, which would change the file while it runs
      - name: What should this run do?
        id: due
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          EMERGENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency }}
        run: |
          git branch -f main origin/main
          git fetch -q origin preview:preview 2>/dev/null || git branch -f preview origin/main
          cp .github/release.sh "$RUNNER_TEMP/release.sh"
          echo "RELEASE_ROOT=$PWD" >> "$GITHUB_ENV"
          echo "REL=$RUNNER_TEMP/release.sh" >> "$GITHUB_ENV"
          RELEASE_ROOT=$PWD "$RUNNER_TEMP/release.sh" plan > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          echo "go=$(sed -n 's/^release=//p' "$RUNNER_TEMP/plan")" >> "$GITHUB_OUTPUT"

      - name: Check the scripts
        if: ${{ steps.due.outputs.go == 'true' }}
        run: |
          bash -n diginode-setup.sh
          bash -n diginode.sh
          bash -n .github/release.sh
          echo "Syntax OK"

      - name: Prepare the release, merge it into main and tag it
        if: ${{ steps.due.outputs.go == 'true' }}
        id: prep
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          SOURCE: ${{ steps.due.outputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$("$REL" build "$SOURCE")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Merged $SOURCE into main and tagged v$version (locally)"

      - name: Show what a cut would do (dry run)
        if: ${{ env.DRY_RUN == 'true' }}
        env:
          CUT: ${{ steps.due.outputs.cut }}
        run: echo "Start a new Sponsors Preview from develop - $CUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: ${{ steps.due.outputs.go == 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run: DigiNode Tools v$VERSION"
              echo "Nothing has been pushed, tagged or published. Run it again with **Dry run** unticked to release."
            else
              echo "## Releasing DigiNode Tools v$VERSION"
            fi
            echo
            echo "### Released from: ${{ steps.due.outputs.source }}"
            echo "### Commits going into main"
            echo '```'
            git log --oneline origin/main..main
            echo '```'
            echo "### GitHub release notes"
            cat "$NOTES_FILE"
            if [ -x .github/telegram-announce.py ]; then
              echo
              echo "### Telegram announcement"
              echo '```html'
              .github/telegram-announce.py preview "$VERSION" "$NOTES_FILE"
              echo '```'
            fi
            if [ -x .github/bluesky-announce.py ]; then
              echo
              echo "### Bluesky thread"
              echo '```'
              .github/bluesky-announce.py preview "$VERSION" "$NOTES_FILE"
              echo '```'
            fi
            if [ -x .github/release-summary.py ]; then
              echo
              echo "### Private summary for Olly (with the Reddit post)"
              echo '```html'
              .github/release-summary.py preview "$VERSION" "$NOTES_FILE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        id: publish
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          git push --atomic origin main "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "DigiNode Tools v$VERSION" --notes-file "$NOTES_FILE" --latest

      # Post the release notes in the DigiNode Tools Telegram group (as "DigiNode Tools Releases") and pin them.
      # If this fails, the release has still been published - an issue is opened instead of failing the release.
      - name: Announce on Telegram
        id: announce
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if [ -x .github/telegram-announce.py ]; then
            .github/telegram-announce.py send "$VERSION" "$NOTES_FILE"
          fi

      # Post the release notes on Bluesky as a thread (from the DigiNode Tools account). Skipped until the app password
      # secret is set. If this fails, the release has still been published - an issue is opened instead.
      - name: Announce on Bluesky
        id: bluesky
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if [ -z "$BLUESKY_APP_PASSWORD" ] || [ -z "$BLUESKY_HANDLE" ]; then
            echo "Bluesky isn't set up yet (BLUESKY_HANDLE variable / BLUESKY_APP_PASSWORD secret) - skipping"
          elif [ -x .github/bluesky-announce.py ]; then
            .github/bluesky-announce.py send "$VERSION" "$NOTES_FILE"
          fi

      # Send Olly a private Telegram message: what was published (and whether each announcement worked), plus a
      # ready-made Reddit post to copy. Runs even if an announcement failed, as long as the release was published.
      - name: Send the release summary to Olly
        if: ${{ always() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GITHUB_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.prep.outputs.version }}
          TELEGRAM_OUTCOME: ${{ steps.announce.outcome }}
          TELEGRAM_POST_URL: ${{ steps.announce.outputs.post_url }}
          BLUESKY_OUTCOME: ${{ steps.bluesky.outcome }}
          BLUESKY_POST_URL: ${{ steps.bluesky.outputs.post_url }}
          VERSION: ${{ steps.prep.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if [ -x .github/release-summary.py ]; then
            .github/release-summary.py send "$VERSION" "$NOTES_FILE"
          fi

      - name: Report a failed Bluesky announcement
        if: ${{ steps.bluesky.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          gh issue create --title "Bluesky announcement failed for v$VERSION" \
            --body "DigiNode Tools v$VERSION was released, but the Bluesky thread couldn't be posted (or was only partly posted). See the workflow run for the error: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report a failed Telegram announcement
        if: ${{ steps.announce.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          gh issue create --title "Telegram announcement failed for v$VERSION" \
            --body "DigiNode Tools v$VERSION was released, but it couldn't be announced on Telegram. See the workflow run for the error: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Get develop ready for the next release
        if: ${{ steps.due.outputs.go == 'true' && env.DRY_RUN != 'true' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          SOURCE: ${{ steps.due.outputs.source }}
        run: |
          "$REL" after "$VERSION" "$SOURCE"
          git push origin develop

      # What is on develop becomes the new preview. With nothing new, the preview is simply the latest release.
      - name: Start the next Sponsors Preview
        id: cut
        if: ${{ env.DRY_RUN != 'true' && (steps.due.outputs.cut == 'true' || steps.due.outputs.go == 'true') }}
        env:
          CUT: ${{ steps.due.outputs.cut }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CUT" = "true" ]; then
            preview_version=$("$REL" cut)
            git push --atomic --force-with-lease=preview origin develop preview
            text="Sponsors Preview v$preview_version has started. Sponsors will see it as an update; everyone else gets it on the next release Tuesday."
          else
            git push --force origin main:preview
            text="No new Sponsors Preview: there is nothing new on develop."
          fi
          echo "$text"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_CHAT_ID" ]; then
            curl -s --max-time 15 -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_OWNER_CHAT_ID" --data-urlencode "text=$text" || true
          fi
